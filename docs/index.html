<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvas - Raji AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .container {
            max-width: 95%;
            width: 450px;
            background-color: #1e293b;
            border: 1px solid #334155;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 1.5rem;
        }
        .mic-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .pulse-ring {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid #38bdf8;
            opacity: 0;
        }
        .active .pulse-ring {
            animation: pulse 2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.6); opacity: 1; }
            100% { transform: scale(1.4); opacity: 0; }
        }
        .mic-btn {
            z-index: 10;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }
        .mic-btn.listening { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .mic-btn.speaking { background: linear-gradient(135deg, #10b981, #059669); }
        .mic-btn:hover { transform: scale(1.05); }
        
        #conversation-container::-webkit-scrollbar { width: 4px; }
        #conversation-container::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container p-6 flex flex-col items-center">
        <header class="text-center mb-6">
            <h1 class="text-3xl font-bold text-sky-400">Jarvas</h1>
            <p class="text-slate-400 text-sm">Raji AI Assistant</p>
        </header>

        <div id="conversation-container" class="w-full h-64 overflow-y-auto bg-slate-900/50 rounded-xl p-4 mb-6 flex flex-col gap-3">
            <div class="text-slate-500 text-center text-xs italic">
                Ready. Say "Jarvis" or click the mic to begin.
            </div>
        </div>

        <div id="mic-wrapper" class="mic-container">
            <div class="pulse-ring"></div>
            <button id="mic-button" class="mic-btn">
                <svg id="mic-icon" class="h-8 w-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                </svg>
            </button>
        </div>

        <p id="status-message" class="text-sm text-slate-400 font-medium">Idle</p>
    </div>

    <script>
        const apiKey = ""; // Environment provided
        const micButton = document.getElementById('mic-button');
        const micWrapper = document.getElementById('mic-wrapper');
        const conversationContainer = document.getElementById('conversation-container');
        const statusMessage = document.getElementById('status-message');
        
        let recognition;
        let isActivated = false;
        let isProcessing = false;
        let isRecognitionActive = false; // Track the actual state of the recognition engine

        // Safely start recognition
        function safeStartRecognition() {
            if (recognition && !isRecognitionActive && !isProcessing && !window.speechSynthesis.speaking) {
                try {
                    recognition.start();
                } catch (e) {
                    console.warn("Recognition start failed:", e);
                }
            }
        }

        // Initialize Speech Recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isRecognitionActive = true;
                updateUI('listening', isActivated ? "Listening for command..." : "Listening for 'Jarvis'...");
            };

            recognition.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript.trim();
                const lower = transcript.toLowerCase();

                if (!isActivated) {
                    if (lower.includes('jarvis')) {
                        isActivated = true;
                        addMessage('user', transcript);
                        handleResponse("Yes? How can I help you today?");
                    }
                } else if (!isProcessing) {
                    addMessage('user', transcript);
                    processWithAI(transcript);
                }
            };

            recognition.onerror = (event) => {
                if (event.error !== 'no-speech' && event.error !== 'aborted') {
                    console.error("Recognition error:", event.error);
                    statusMessage.textContent = "Mic Error: " + event.error;
                }
            };

            recognition.onend = () => {
                isRecognitionActive = false;
                // Only restart if we aren't busy with AI or TTS
                if (!isProcessing && !window.speechSynthesis.speaking) {
                    setTimeout(safeStartRecognition, 300);
                }
            };
        }

        async function processWithAI(userInput) {
            isProcessing = true;
            updateUI('processing', "Jarvas is thinking...");
            
            if (recognition) {
                recognition.stop();
            }

            const systemPrompt = "You are Jarvas, a helpful AI assistant. Be concise, polite, and professional. Use natural language. If asked about your creator, you were created by Raji Technology innovator Amer Abdullah.";
            
            const fetchWithRetry = async (url, options, retries = 5, backoff = 1000) => {
                try {
                    const res = await fetch(url, options);
                    if (!res.ok) throw new Error(res.statusText);
                    return await res.json();
                } catch (err) {
                    if (retries <= 0) throw err;
                    await new Promise(resolve => setTimeout(resolve, backoff));
                    return fetchWithRetry(url, options, retries - 1, backoff * 2);
                }
            };

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                const data = await fetchWithRetry(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userInput }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });

                const aiResponse = data.candidates?.[0]?.content?.parts?.[0]?.text || "I'm sorry, I couldn't process that.";
                handleResponse(aiResponse);
            } catch (error) {
                handleResponse("I am having trouble reaching my servers. Please check your connection.");
            } finally {
                isProcessing = false;
                // Recognition will be restarted in speak() or on end of speech
            }
        }

        function handleResponse(text) {
            addMessage('jarvas', text);
            speak(text);
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            
            const voices = window.speechSynthesis.getVoices();
            utterance.voice = voices.find(v => v.name.includes("Male") || v.name.includes("UK")) || voices[0];
            utterance.pitch = 0.9;
            utterance.rate = 1.0;

            utterance.onstart = () => {
                if (recognition) recognition.stop();
                updateUI('speaking', "Jarvas is speaking...");
            };

            utterance.onend = () => {
                updateUI('listening', "Listening...");
                setTimeout(safeStartRecognition, 500);
            };

            window.speechSynthesis.speak(utterance);
        }

        function addMessage(sender, text) {
            const msg = document.createElement('div');
            msg.className = `p-3 rounded-lg text-sm max-w-[85%] ${sender === 'user' ? 'bg-sky-600 ml-auto' : 'bg-slate-800 mr-auto border border-slate-700'}`;
            msg.textContent = text;
            conversationContainer.appendChild(msg);
            conversationContainer.scrollTop = conversationContainer.scrollHeight;
        }

        function updateUI(state, message) {
            statusMessage.textContent = message;
            micButton.className = 'mic-btn';
            micWrapper.classList.remove('active');

            if (state === 'listening') {
                micButton.classList.add('listening');
                micWrapper.classList.add('active');
            } else if (state === 'speaking') {
                micButton.classList.add('speaking');
            }
        }

        micButton.addEventListener('click', () => {
            if (!isActivated) {
                isActivated = true;
                handleResponse("Jarvas online. How can I help?");
            } else {
                if (isRecognitionActive) {
                    recognition.stop();
                } else {
                    safeStartRecognition();
                }
            }
        });

        window.onload = () => {
            safeStartRecognition();
            window.speechSynthesis.getVoices();
        };
    </script>
</body>
</html>
