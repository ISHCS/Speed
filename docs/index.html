<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvas - Raji AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #init-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.98);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }
        .container {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            background-color: #1e293b;
            border: 1px solid #334155;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 1.5rem;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .mic-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .pulse-ring {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #38bdf8;
            opacity: 0;
        }
        .active .pulse-ring {
            animation: pulse 1.5s cubic-bezier(0.24, 0, 0.38, 1) infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.6); opacity: 1; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        .mic-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: all 0.3s ease;
        }
        .mic-btn.listening { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .mic-btn.speaking { background: linear-gradient(135deg, #10b981, #059669); }
        
        #conversation-container::-webkit-scrollbar { width: 4px; }
        #conversation-container::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        
        .message-bubble {
            animation: slideIn 0.2s ease-out;
            word-wrap: break-word;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="init-overlay">
        <div class="text-center p-6">
            <div class="mb-6 bg-sky-500/10 p-8 rounded-full inline-block animate-pulse">
                <svg class="h-16 w-16 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </div>
            <h2 class="text-3xl font-bold text-white mb-2">Initialize Jarvas</h2>
            <p class="text-slate-400 mb-8 max-w-xs mx-auto">Click to grant microphone access and engage always-listening mode</p>
            <button class="px-8 py-3 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-full transition-all shadow-lg shadow-sky-900/20">
                WAKE SYSTEM
            </button>
        </div>
    </div>

    <div class="container p-6">
        <header class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-sky-400">Jarvas</h1>
                <p id="status-text" class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">SYSTEM STANDBY</p>
            </div>
            <div id="mic-wrapper" class="mic-container">
                <div class="pulse-ring"></div>
                <div id="mic-indicator" class="mic-btn">
                    <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                    </svg>
                </div>
            </div>
        </header>

        <div id="conversation-container" class="flex-1 overflow-y-auto mb-4 flex flex-col gap-4 pr-2">
            <div class="message-bubble bg-slate-800 mr-auto rounded-xl rounded-tl-none border border-slate-700 p-3 text-sm text-slate-100">
                Jarvas online. Say "Jarvas" or click the wake button to begin.
            </div>
        </div>

        <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700">
            <p class="text-[9px] text-slate-500 uppercase tracking-widest font-black mb-1">Live Input Buffer</p>
            <p id="interim-text" class="text-sm text-sky-300 italic min-h-[1.25rem] truncate">...</p>
        </div>
    </div>

    <script>
        const apiKey = ""; 
        const modelName = "gemini-2.5-flash-preview-09-2025";
        const ttsModelName = "gemini-2.5-flash-preview-tts";

        const conversationContainer = document.getElementById('conversation-container');
        const statusText = document.getElementById('status-text');
        const interimDisplay = document.getElementById('interim-text');
        const micWrapper = document.getElementById('mic-wrapper');
        const micIndicator = document.getElementById('mic-indicator');
        const initOverlay = document.getElementById('init-overlay');
        
        let recognition;
        let isProcessing = false;
        let isRecognitionActive = false;
        let audioContext;
        let isSpeaking = false;
        let wakeWordDetected = false;

        async function fetchWithRetry(url, options, retries = 5) {
            let delay = 1000;
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) return await response.json();
                    if (response.status === 429 || response.status >= 500) {
                        await new Promise(r => setTimeout(r, delay));
                        delay *= 2;
                        continue;
                    }
                    throw new Error(`HTTP Error: ${response.status}`);
                } catch (e) {
                    if (i === retries - 1) throw e;
                    await new Promise(r => setTimeout(r, delay));
                    delay *= 2;
                }
            }
        }

        async function processWithAI(userInput) {
            if (isProcessing) return;
            isProcessing = true;
            updateUI('processing', "ANALYZING...");
            
            const systemPrompt = "You are Jarvas, an AI assistant created by Raji Technology innovator Amer Abdullah. Be extremely concise. Respond in under 15 words.";
            
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
                const result = await fetchWithRetry(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userInput }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });

                const aiResponse = result.candidates?.[0]?.content?.parts?.[0]?.text || "Link failure.";
                addMessage('jarvas', aiResponse);
                await speak(aiResponse);
            } catch (error) {
                console.error(error);
                statusText.textContent = "CORE LINK ERROR";
                isProcessing = false;
                startListeningLoop();
            } finally {
                isProcessing = false;
            }
        }

        async function speak(text) {
            isSpeaking = true;
            updateUI('speaking', "VOCALIZING...");
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${ttsModelName}:generateContent?key=${apiKey}`;
                const result = await fetchWithRetry(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Say in a helpful assistant voice: ${text}` }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } } }
                        }
                    })
                });

                const audioData = result.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                if (audioData) {
                    await playPCM(audioData);
                } else {
                    throw new Error("No audio data");
                }
            } catch (e) {
                console.warn("TTS fallback", e);
                const ut = new SpeechSynthesisUtterance(text);
                ut.onend = () => { isSpeaking = false; startListeningLoop(); };
                window.speechSynthesis.speak(ut);
            }
        }

        async function playPCM(base64Data) {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const binaryString = atob(base64Data);
            const len = binaryString.length;
            const bytes = new Int16Array(len / 2);
            for (let i = 0; i < len; i += 2) {
                bytes[i / 2] = (binaryString.charCodeAt(i + 1) << 8) | binaryString.charCodeAt(i);
            }

            const buffer = new ArrayBuffer(44 + bytes.length * 2);
            const view = new DataView(buffer);
            const writeString = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
            
            writeString(0, 'RIFF');
            view.setUint32(4, 36 + bytes.length * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, 24000, true);
            view.setUint32(28, 48000, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, bytes.length * 2, true);
            for (let i = 0; i < bytes.length; i++) {
                view.setInt16(44 + i * 2, bytes[i], true);
            }

            const audioBlob = new Blob([buffer], { type: 'audio/wav' });
            const audioUrl = URL.createObjectURL(audioBlob);
            const audio = new Audio(audioUrl);
            
            return new Promise((resolve) => {
                audio.onended = () => {
                    URL.revokeObjectURL(audioUrl);
                    isSpeaking = false;
                    startListeningLoop();
                    resolve();
                };
                audio.onerror = () => {
                    isSpeaking = false;
                    startListeningLoop();
                    resolve();
                };
                audio.play().catch(e => {
                    isSpeaking = false;
                    startListeningLoop();
                    resolve();
                });
            });
        }

        function startListeningLoop() {
            if (isProcessing || isSpeaking) return;
            if (recognition && !isRecognitionActive) {
                try { 
                    recognition.start(); 
                } catch(e) {
                    console.error("Recognition start error", e);
                }
            }
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => { 
                isRecognitionActive = true; 
                updateUI('listening', wakeWordDetected ? "LISTENING..." : "AWAITING WAKE WORD...");
            };

            recognition.onend = () => { 
                isRecognitionActive = false;
                if (!isProcessing && !isSpeaking) {
                    setTimeout(startListeningLoop, 100);
                }
            };

            recognition.onresult = (event) => {
                let finalTranscript = '';
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
                    else interimTranscript += event.results[i][0].transcript;
                }

                interimDisplay.textContent = interimTranscript || finalTranscript || "...";
                const checkText = (finalTranscript || interimTranscript).toLowerCase();

                if (!wakeWordDetected) {
                    if (checkText.includes('jarvis') || checkText.includes('jarvas')) {
                        wakeWordDetected = true;
                        recognition.stop();
                        processWithAI("Jarvas online. How can I assist you today?");
                    }
                } else if (finalTranscript.trim() && !isProcessing && !isSpeaking) {
                    addMessage('user', finalTranscript);
                    recognition.stop(); 
                    processWithAI(finalTranscript);
                }
            };

            recognition.onerror = (event) => {
                if (event.error === 'not-allowed') {
                    statusText.textContent = "MIC PERMISSION DENIED";
                }
                isRecognitionActive = false;
            };
        } else {
            statusText.textContent = "BROWSER NOT SUPPORTED";
        }

        function addMessage(sender, text) {
            const msg = document.createElement('div');
            msg.className = `message-bubble p-3 rounded-xl text-sm max-w-[90%] ${
                sender === 'user' ? 'bg-sky-600 ml-auto rounded-tr-none text-white' : 'bg-slate-800 mr-auto rounded-tl-none border border-slate-700 text-slate-100'
            }`;
            msg.textContent = text;
            conversationContainer.appendChild(msg);
            conversationContainer.scrollTop = conversationContainer.scrollHeight;
        }

        function updateUI(state, message) {
            statusText.textContent = message;
            micIndicator.className = 'mic-btn';
            micWrapper.classList.remove('active');
            
            if (state === 'listening') { 
                micIndicator.classList.add('listening'); 
                micWrapper.classList.add('active'); 
            }
            else if (state === 'speaking') { 
                micIndicator.classList.add('speaking'); 
                micWrapper.classList.add('active'); 
            }
            else if (state === 'processing') { 
                micIndicator.style.opacity = "0.5"; 
            }
            else { 
                micIndicator.style.opacity = "1"; 
            }
        }

        initOverlay.addEventListener('click', () => {
            initOverlay.style.opacity = '0';
            setTimeout(() => {
                initOverlay.style.display = 'none';
                if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
                startListeningLoop();
            }, 500);
        });

        setInterval(() => {
            if (!isRecognitionActive && !isProcessing && !isSpeaking && audioContext) {
                startListeningLoop();
            }
        }, 3000);
    </script>
</body>
</html>
