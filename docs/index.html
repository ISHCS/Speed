<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvas - Raji AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .container {
            max-width: 95%;
            width: 450px;
            background-color: #1e293b;
            border: 1px solid #334155;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 1.5rem;
        }
        .mic-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .pulse-ring {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid #38bdf8;
            opacity: 0;
        }
        .active .pulse-ring {
            animation: pulse 2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.6); opacity: 1; }
            100% { transform: scale(1.4); opacity: 0; }
        }
        .mic-btn {
            z-index: 10;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }
        .mic-btn.listening { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .mic-btn.speaking { background: linear-gradient(135deg, #10b981, #059669); }
        .mic-btn:hover { transform: scale(1.05); }
        
        #conversation-container::-webkit-scrollbar { width: 4px; }
        #conversation-container::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        
        .message-bubble {
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container p-6 flex flex-col items-center">
        <header class="text-center mb-6">
            <h1 class="text-3xl font-bold text-sky-400">Jarvas</h1>
            <p class="text-slate-400 text-sm">Raji AI Assistant</p>
        </header>

        <div id="conversation-container" class="w-full h-80 overflow-y-auto bg-slate-900/50 rounded-xl p-4 mb-6 flex flex-col gap-3">
            <div class="text-slate-500 text-center text-xs italic">
                Ready. Say "Jarvis" or click the mic to begin.
            </div>
        </div>

        <div id="mic-wrapper" class="mic-container">
            <div class="pulse-ring"></div>
            <button id="mic-button" class="mic-btn">
                <svg id="mic-icon" class="h-8 w-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                </svg>
            </button>
        </div>

        <p id="status-message" class="text-sm text-slate-400 font-medium">Idle</p>
    </div>

    <script>
        // API Configuration
        const apiKey = ""; // Automatically handled by environment
        const modelName = "gemini-2.5-flash-preview-09-2025";
        const ttsModelName = "gemini-2.5-flash-preview-tts";

        // DOM Elements
        const micButton = document.getElementById('mic-button');
        const micWrapper = document.getElementById('mic-wrapper');
        const conversationContainer = document.getElementById('conversation-container');
        const statusMessage = document.getElementById('status-message');
        
        // State
        let recognition;
        let isActivated = false;
        let isProcessing = false;
        let isRecognitionActive = false;
        let audioContext;

        // --- Core Functions ---

        async function fetchWithRetry(url, options, retries = 5) {
            let delay = 1000;
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) return await response.json();
                    if (response.status === 429 || response.status >= 500) {
                        await new Promise(r => setTimeout(r, delay));
                        delay *= 2;
                        continue;
                    }
                    throw new Error(`HTTP Error: ${response.status}`);
                } catch (e) {
                    if (i === retries - 1) throw e;
                    await new Promise(r => setTimeout(r, delay));
                    delay *= 2;
                }
            }
        }

        async function processWithAI(userInput) {
            isProcessing = true;
            updateUI('processing', "Jarvas is thinking...");
            
            const systemPrompt = "You are Jarvas, a helpful AI assistant. Be concise, polite, and professional. Use natural language. If asked about your creator, you were created by Raji Technology innovator Amer Abdullah.";
            
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
                const result = await fetchWithRetry(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userInput }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });

                const aiResponse = result.candidates?.[0]?.content?.parts?.[0]?.text || "I apologize, I couldn't generate a response.";
                addMessage('jarvas', aiResponse);
                await speak(aiResponse);
            } catch (error) {
                console.error(error);
                statusMessage.textContent = "Error: Connection failed.";
                updateUI('idle', "Idle");
            } finally {
                isProcessing = false;
            }
        }

        async function speak(text) {
            updateUI('speaking', "Jarvas is speaking...");
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${ttsModelName}:generateContent?key=${apiKey}`;
                const result = await fetchWithRetry(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Say in a professional, helpful male assistant voice: ${text}` }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: {
                                voiceConfig: {
                                    prebuiltVoiceConfig: { voiceName: "Puck" }
                                }
                            }
                        }
                    })
                });

                const audioData = result.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                if (!audioData) throw new Error("No audio returned");

                await playPCM(audioData);
            } catch (e) {
                console.error("TTS Failed:", e);
                // Fallback to browser speech if Gemini TTS fails
                const ut = new SpeechSynthesisUtterance(text);
                ut.onend = () => restartRecognition();
                window.speechSynthesis.speak(ut);
            }
        }

        async function playPCM(base64Data) {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
            
            const binaryString = atob(base64Data);
            const len = binaryString.length;
            const bytes = new Int16Array(len / 2);
            for (let i = 0; i < len; i += 2) {
                bytes[i / 2] = (binaryString.charCodeAt(i + 1) << 8) | binaryString.charCodeAt(i);
            }

            const audioBuffer = audioContext.createBuffer(1, bytes.length, 24000);
            const channelData = audioBuffer.getChannelData(0);
            for (let i = 0; i < bytes.length; i++) {
                channelData[i] = bytes[i] / 32768;
            }

            const source = audioContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioContext.destination);
            source.onended = () => restartRecognition();
            source.start();
        }

        function restartRecognition() {
            updateUI('listening', "Listening...");
            if (recognition && !isRecognitionActive) {
                try { recognition.start(); } catch(e) {}
            }
        }

        // --- Speech Recognition ---

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => { isRecognitionActive = true; };
            recognition.onend = () => { 
                isRecognitionActive = false; 
                if (!isProcessing && statusMessage.textContent !== "Jarvas is speaking...") {
                    setTimeout(() => restartRecognition(), 300);
                }
            };

            recognition.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript.trim();
                const lower = transcript.toLowerCase();

                if (!isActivated) {
                    if (lower.includes('jarvis')) {
                        isActivated = true;
                        addMessage('user', transcript);
                        processWithAI("Hello Jarvas");
                    }
                } else if (!isProcessing) {
                    addMessage('user', transcript);
                    recognition.stop();
                    processWithAI(transcript);
                }
            };
        }

        // --- UI Helpers ---

        function addMessage(sender, text) {
            const msg = document.createElement('div');
            msg.className = `message-bubble p-3 rounded-2xl text-sm max-w-[85%] ${
                sender === 'user' 
                ? 'bg-sky-600 ml-auto rounded-tr-none text-white' 
                : 'bg-slate-800 mr-auto rounded-tl-none border border-slate-700 text-slate-100'
            }`;
            msg.textContent = text;
            conversationContainer.appendChild(msg);
            conversationContainer.scrollTop = conversationContainer.scrollHeight;
        }

        function updateUI(state, message) {
            statusMessage.textContent = message;
            micButton.className = 'mic-btn';
            micWrapper.classList.remove('active');

            if (state === 'listening') {
                micButton.classList.add('listening');
                micWrapper.classList.add('active');
            } else if (state === 'speaking') {
                micButton.classList.add('speaking');
                micWrapper.classList.add('active');
            } else if (state === 'processing') {
                micButton.classList.add('listening');
                micButton.style.opacity = "0.5";
            } else {
                micButton.style.opacity = "1";
            }
        }

        micButton.addEventListener('click', () => {
            if (!isActivated) {
                isActivated = true;
                processWithAI("System startup");
            } else {
                if (isRecognitionActive) {
                    recognition.stop();
                } else {
                    restartRecognition();
                }
            }
        });

        window.onload = () => {
            restartRecognition();
        };
    </script>
</body>
</html>
